<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome - Potify Mini Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #6600ff 0%, #00e1ff 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .welcome-box {
            background: #fff;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 8px 32px #6600ff33;
            text-align: center;
        }
        .welcome-box h1 {
            color: #6600ff;
            font-size: 48px;
            margin-bottom: 16px;
        }
        .welcome-box p {
            color: #333;
            font-size: 22px;
            margin-bottom: 40px;
        }
        .welcome-box .login-btn {
            background: #dc0252;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 16px 48px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .welcome-box .login-btn:hover {
            background: #cd123d;
        }
        .welcome-box .fa-music {
            color: #00e1ff;
            font-size: 48px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <!-- <i class="fa fa-music"></i> -->
         <img src="potify.png" style="height: 100px; width: 250px;" alt="">
        <h1>Welcome to Potify</h1>
        <p>Your mini music player experience starts here.</p>
        <a href="home.html" class="login-btn">Login</a>
    </div>
</body>
</html>
